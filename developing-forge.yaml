runtimes:
  codex:
    kind: codex

threads:
  develop-manager:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &developerWorkspacePath output/codebase

  develop-coding:
    runtime: codex
    options:
      model: gpt-5.3-codex-spark
      sandboxMode: danger-full-access
      workingDirectory: *developerWorkspacePath

  memory:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &memoryWorkingDir output/developing

agents:
  coding-manager:
    thread: develop-manager
    constants:
      workspacePath: *developerWorkspacePath

  developer:
    thread: develop-coding
    constants:
      workspacePath: *developerWorkspacePath
      prompts:
        - url: https://raw.githubusercontent.com/DietrichGebert/ponytail/HEAD/skills/ponytail/SKILL.md

  code-reviewer:
    thread: develop-manager
    constants:
      workspacePath: *developerWorkspacePath
      prompts:
        - url: https://raw.githubusercontent.com/DietrichGebert/ponytail/HEAD/skills/ponytail-review/SKILL.md

  memory-reader: &memoryAgentConfig
    thread: memory
    constants:
      workingDir: *memoryWorkingDir

  memory-modify-planner: *memoryAgentConfig
  memory-modifier: *memoryAgentConfig
  memory-create-planner: *memoryAgentConfig
  memory-creator: *memoryAgentConfig
  memory-cleaner: *memoryAgentConfig
