runtimes:
  codex:
    kind: codex

threads:
  skill:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: .

  develop:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &developerWorkspacePath output/codebase

  develop-cheap:
    runtime: codex
    options:
      model: gpt-5.3-codex-spark
      sandboxMode: danger-full-access
      workingDirectory: *developerWorkspacePath

  memory:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &memoryWorkingDir output/developing

agents:
  coding-manager:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath

  developer:
    thread: develop-cheap
    constants:
      workspacePath: *developerWorkspacePath

  code-reviewer:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath

  trajectory-optimizer:
    thread: skill

  memory-reader:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir

  memory-modify-planner:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir

  memory-modifier:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir

  memory-create-planner:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir

  memory-creator:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
