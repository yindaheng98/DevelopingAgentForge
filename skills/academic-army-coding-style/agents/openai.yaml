interface:
  display_name: "Academic Army Excellent Repo"
  short_description: "Build and revise maintainable research repos"
  default_prompt: "Use $academic-army-excellent-repo to create or make a focused improvement to a low-friction research code repository from the paper blueprint, experiment plan, coding plan, and the repository path I provide."

dependencies:
  tools:
    - type: "mcp"
      value: "academic_army_mcp_tools"
      description: "Provides academic_army_mcp_tools.deepresearch for current repository, tooling, framework, harness, testing, and artifact-structure evidence."
      transport: "stdio"
